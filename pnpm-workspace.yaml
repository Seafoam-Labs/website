allowBuilds:
  esbuild: true
  sharp: true
# astro 7.4.7's rolldown pulls in @emnapi/runtime 2.0.0-beta, which pnpm then
# resolves for @napi-rs/wasm-runtime's peer; the beta API crashes under Node 26
# and breaks astro2tsx (astro check). Pin the wasm-runtime peer to the 1.x line.
overrides:
  "@napi-rs/wasm-runtime>@emnapi/runtime": ^1.11.3
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.62.0"
  - "@typescript-eslint/parser@8.62.0"
  - "@typescript-eslint/project-service@8.62.0"
  - "@typescript-eslint/scope-manager@8.62.0"
  - "@typescript-eslint/tsconfig-utils@8.62.0"
  - "@typescript-eslint/type-utils@8.62.0"
  - "@typescript-eslint/types@8.62.0"
  - "@typescript-eslint/typescript-estree@8.62.0"
  - "@typescript-eslint/utils@8.62.0"
  - "@typescript-eslint/visitor-keys@8.62.0"
  - astro@7.0.1 || 7.0.3 || 7.2.4
  - globals@17.7.0
  - typescript-eslint@8.62.0
  - "@astrojs/starlight@0.41.1 || 0.42.2"
  - "@expressive-code/core@0.44.0"
  - "@expressive-code/plugin-frames@0.44.0"
  - "@expressive-code/plugin-shiki@0.44.0"
  - "@expressive-code/plugin-text-markers@0.44.0"
  - astro-expressive-code@0.44.0
  - expressive-code@0.44.0
  - rehype-expressive-code@0.44.0
  - "@astrojs/internal-helpers@0.10.4"
  - "@astrojs/markdown-satteri@0.3.7"
  - "@tailwindcss/oxide@4.3.5"
