<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming</title>
<style>
  /* Palette mirrors adw-gtk3 / libadwaita so the page reads as part of the GTK
     theme. WebKitGTK tracks notify::gtk-application-prefer-dark-theme and
     notify::gtk-theme-name, so this follows the desktop live. */
  :root {
    color-scheme: light dark;
    --bg: #fafafb;
    --card: #ffffff;
    --fg: rgba(0, 0, 6, 0.8);
    --muted: rgba(0, 0, 6, 0.55);
    --line: rgba(0, 0, 6, 0.07);
    --accent-bg: #3584e4;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #222226;
      --card: rgba(255, 255, 255, 0.08);
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.55);
      --line: rgba(0, 0, 6, 0.36);
      --accent-bg: #1c71d8;
      --accent-fg: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 Cantarell, "Segoe UI", system-ui, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
  .sub { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .meta { flex: 1; min-width: 0; }
  .meta h2 { margin: 0; font-size: 15px; }
  .meta p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  button {
    border: 0;
    border-radius: 8px;
    padding: 8px 16px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-fg);
    background: var(--accent-bg);
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin: 16px 0 0; min-height: 1.5em; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<h1>Gaming</h1>
<p class="sub">Hand-picked gaming packages for Devario.</p>
<div class="grid" id="grid"></div>
<p id="status" role="status"></p>
<script>
const wanted = [
  { name: "Steam", pkg: "steam" },
  { name: "Faugus Launcher", pkg: "faugus-launcher" },
  { name: "MangoHud", pkg: "mangohud" },
];

const grid = document.getElementById("grid");
const status = document.getElementById("status");

function bridge(payload) {
  return window.webkit.messageHandlers.devario.postMessage(payload);
}

const cards = wanted.map((w) => {
  const card = document.createElement("div");
  card.className = "card";

  const meta = document.createElement("div");
  meta.className = "meta";

  const heading = document.createElement("h2");
  heading.textContent = w.name;

  const detail = document.createElement("p");
  detail.textContent = "Checking…";

  meta.append(heading, detail);

  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "Install";
  button.disabled = true;
  button.addEventListener("click", () => install(w, button));

  card.append(meta, button);
  grid.append(card);

  return { w, detail, button };
});

async function refresh() {
  status.textContent = "Checking what is already installed…";

  let states;
  try {
    states = await bridge({ action: "state", pkgs: wanted.map((w) => w.pkg) });
  } catch (err) {
    status.textContent = `Could not read package state: ${err.message}`;
    for (const card of cards) card.detail.textContent = "Unavailable";
    return;
  }

  for (const card of cards) {
    const state = states.find((s) => s.pkg === card.w.pkg) || {};
    if (state.installed) {
      card.detail.textContent = `Installed · ${state.version || "unknown version"}`;
      card.button.textContent = "Installed";
      card.button.disabled = true;
    } else if (!state.found) {
      card.detail.textContent = "Not in the configured repositories";
      card.button.textContent = "Not found";
      card.button.disabled = true;
    } else {
      card.detail.textContent = `${state.version || "unknown version"} · ${state.repository || "repository"}`;
      card.button.textContent = "Install";
      card.button.disabled = false;
    }
  }

  status.textContent = "";
}

async function install(w, button) {
  button.disabled = true;
  button.textContent = "Queued";
  status.textContent = "";

  try {
    await bridge({ action: "install", pkg: w.pkg });
    button.textContent = "Installed";
    status.textContent = `${w.name} installed.`;
  } catch (err) {
    button.textContent = "Install";
    button.disabled = false;
    status.textContent = `${w.name}: ${err.message}`;
  }
}

refresh();
</script>
</body>
</html>
